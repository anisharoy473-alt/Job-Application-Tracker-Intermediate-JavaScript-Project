<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - CareerTrack</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body onload="loadAdminDashboard()">

<header class="dashboard-header">
    <h2>CareerTrack<span>.</span> Admin</h2>
    <button onclick="logoutUser()">Log Out</button>
</header>

<div class="dashboard-container">

    <aside class="sidebar">
        <h3>Admin Panel</h3>
        <a href="#overview">Dashboard</a>
        <a href="#addJob">Add New Job</a>
        <a href="#manageJobs">Manage Jobs</a>
        <a href="#users">Registered Users</a>
    </aside>

    <main class="main-content">

        <section id="overview">
            <h1>Admin Dashboard</h1>
            <p class="subtitle">Manage job opportunities and registered users.</p>

            <div class="stats">
                <div class="stat-card">
                    <h2 id="totalJobs">0</h2>
                    <p>Total Jobs</p>
                </div>

                <div class="stat-card">
                    <h2 id="totalUsers">0</h2>
                    <p>Registered Users</p>
                </div>

                <div class="stat-card">
                    <h2 id="totalApplications">0</h2>
                    <p>Total Applications</p>
                </div>
            </div>
        </section>

        <section id="addJob" class="panel">
            <h2>Add New Job</h2>

            <form onsubmit="addJob(event)" class="job-form">

                <label>Job Title</label>
                <input type="text" id="jobTitle" required>

                <label>Company Name</label>
                <input type="text" id="companyName" required>

                <label>Location</label>
                <input type="text" id="jobLocation" required>

                <label>Job Type</label>
                <select id="jobType">
                    <option>Full Time</option>
                    <option>Part Time</option>
                    <option>Internship</option>
                    <option>Remote</option>
                </select>

                <label>Salary / Stipend</label>
                <input type="text" id="jobSalary" placeholder="Example: ₹15,000 - ₹25,000">

                <label>Job Description</label>
                <textarea id="jobDescription" rows="4" required></textarea>

                <label>Requirements</label>
                <textarea id="jobRequirements" rows="4" required></textarea>

                <button type="submit">Add Job</button>
            </form>
        </section>

        <section id="manageJobs" class="panel">
            <h2>Manage Job Listings</h2>
            <div id="adminJobList"></div>
        </section>

        <section id="users" class="panel">
            <h2>Registered Users</h2>
            <div id="adminUserList"></div>
        </section>

    </main>
</div>

<script src="script.js"></script>
</body>
</html>
